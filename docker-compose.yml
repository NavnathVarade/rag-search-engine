# Base stack. No database/cache ports are published here: dev-only host ports live in
# docker-compose.override.yml (auto-loaded by plain `docker compose up`), so the
# production overlay (-f docker-compose.yml -f docker-compose.prod.yml) cannot inherit them.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Apply migrations, then serve. (Run a single API instance, or migrate in a separate one-off job.)
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn rag_engine.api.app:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:${POSTGRES_PASSWORD:-rag}@postgres:5432/rag
      LOG_LEVEL: INFO
      LOG_JSON: "true"
      ENVIRONMENT: development
      STORE_BACKEND: postgres   # documents/chunks live in Postgres; the index is rebuilt from it at startup
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:${POSTGRES_PASSWORD:-rag}@postgres:5432/rag
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
